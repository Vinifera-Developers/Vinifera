#
# GitHub action to build pull requests.
#

name: Pull Request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pull Request
    uses: ./.github/workflows/build.yml
    with:
      build-flag: PREVIEW
      artifact-prefix: vinifera-preview
