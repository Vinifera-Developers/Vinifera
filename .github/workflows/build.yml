#
# Reusable workflow that builds Vinifera and uploads the resulting artifact.
#

name: Build

on:
  workflow_call:
    inputs:
      build-flag:
        description: "CMake build-type flag to enable (e.g. NIGHTLY, PREVIEW, RELEASE)."
        required: true
        type: string
      artifact-prefix:
        description: "Prefix for the uploaded artifact name."
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-2022
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Files
        uses: actions/checkout@v4
        with:
          repository: Vinifera-Developers/Vinifera-Files
          path: vinifera-files

      - name: Set Variables
        id: vars
        shell: bash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        run: |
          Invoke-WebRequest -Uri https://github.com/ninja-build/ninja/releases/download/v1.10.1/ninja-win.zip -OutFile $Env:TEMP\ninja-win.zip
          Expand-Archive $Env:TEMP\ninja-win.zip -DestinationPath $Env:TEMP\ninja
          echo "$Env:TEMP\ninja" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: ilammy/msvc-dev-cmd@v1.10.0
        with:
          arch: x86

      - name: Configure Project
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -B build -D${{ inputs.build-flag }}=ON

      - name: Build Project
        run: |
          cmake --build build --config RelWithDebInfo

      - name: Copy Binaries
        shell: bash
        run: |
          mkdir artifact
          mkdir artifact/Movies
          cp ./build/Vinifera.dll ./artifact/Vinifera.dll
          cp ./build/Vinifera.pdb ./artifact/Vinifera.pdb
          cp ./Syringe/Syringe.exe ./artifact/LaunchVinifera.exe
          cp ./TSpp/pdb/Game.pdb ./artifact/Game.pdb
          cp ./TSpp/edb/Game.edb ./artifact/Game.edb
          cp ./vinifera-files/files/VINIFERA.WMV ./artifact/Movies/VINIFERA.WMV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-${{ steps.vars.outputs.sha_short }}
          path: artifact
